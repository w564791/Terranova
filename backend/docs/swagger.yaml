  /api/v1/terraform/state/{workspace_id}:
    delete:
      description: 'State deletion via the HTTP backend is not supported. Manage state
        versions through the UI/API. Auth: HTTP Basic Auth where the password is a
        State Token JWT.'
      parameters:
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        type: string
      - description: Basic auth with State Token JWT as password
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "401":
          description: Authentication required or invalid token
          schema:
            additionalProperties: true
            type: object
        "405":
          description: Method not allowed
          schema:
            additionalProperties: true
            type: object
      summary: Delete Terraform state (not supported)
      tags:
      - Terraform State Backend
    get:
      description: 'Retrieve the latest Terraform state JSON for a workspace. Auth:
        HTTP Basic Auth where the password is a State Token JWT (username ignored).
        Supports cross-workspace GET when the requester workspace is allowed to read
        shared outputs.'
      parameters:
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        type: string
      - description: Basic auth with State Token JWT as password
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Terraform state JSON
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Authentication required or invalid token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Cross-workspace access denied
          schema:
            additionalProperties: true
            type: object
        "404":
          description: State not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties: true
            type: object
      summary: Get Terraform state
      tags:
      - Terraform State Backend
    post:
      consumes:
      - application/json
      description: 'Upload Terraform state for a workspace. Auth: HTTP Basic Auth
        where the password is a State Token JWT. When holding a lock, Terraform passes
        the lock ID via the ID query parameter.'
      parameters:
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        type: string
      - description: Lock ID held by Terraform
        in: query
        name: ID
        type: string
      - description: Basic auth with State Token JWT as password
        in: header
        name: Authorization
        required: true
        type: string
      - description: Terraform state JSON
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: State saved
          schema:
            type: string
        "400":
          description: Invalid body
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Authentication required or invalid token
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Lock ID mismatch
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to save state
          schema:
            additionalProperties: true
            type: object
      summary: Update Terraform state
      tags:
      - Terraform State Backend
  /api/v1/terraform/state/{workspace_id}/lock:
    post:
      consumes:
      - application/json
      description: 'Acquire a workspace lock for exclusive state access. Auth: HTTP
        Basic Auth where the password is a State Token JWT. On conflict returns the
        existing lock info.'
      parameters:
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        type: string
      - description: Basic auth with State Token JWT as password
        in: header
        name: Authorization
        required: true
        type: string
      - description: Terraform lock info (must include ID when provided by Terraform)
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Lock acquired
          schema:
            type: string
        "400":
          description: Invalid lock info
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Authentication required or invalid token
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Already locked (returns current lock info)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lock failed
          schema:
            additionalProperties: true
            type: object
      summary: Lock Terraform state
      tags:
      - Terraform State Backend
  /api/v1/terraform/state/{workspace_id}/unlock:
    post:
      consumes:
      - application/json
      description: 'Release a workspace lock. Auth: HTTP Basic Auth where the password
        is a State Token JWT. When a lock ID is provided in the body, only that lock
        is released.'
      parameters:
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        type: string
      - description: Basic auth with State Token JWT as password
        in: header
        name: Authorization
        required: true
        type: string
      - description: Terraform lock info with ID to unlock
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Lock released
          schema:
            type: string
        "401":
          description: Authentication required or invalid token
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Lock ID mismatch (returns current lock info)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Unlock failed
          schema:
            additionalProperties: true
            type: object
      summary: Unlock Terraform state
      tags:
      - Terraform State Backend
