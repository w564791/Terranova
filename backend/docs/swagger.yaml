basePath: /
definitions:
  controllers.AnalyzeErrorRequest:
    properties:
      task_id:
        type: integer
    required:
    - task_id
    type: object
  controllers.AssessmentStats:
    properties:
      l1_fail:
        type: integer
      l1_pass:
        type: integer
      l1_pass_rate:
        type: number
      l1_warn:
        type: integer
      l2_avg_score:
        type: number
      l3_avg_score:
        type: number
      total_assessed:
        type: integer
    type: object
  controllers.CheckDraftRequest:
    properties:
      context_ids:
        properties:
          organization_id:
            type: string
          workspace_id:
            type: string
        type: object
      files:
        description: 当前文件 + 跨文件关联文件
        items:
          $ref: '#/definitions/controllers.CheckFile'
        minItems: 1
        type: array
      history:
        description: 会话历史(上下文对话)
        items:
          $ref: '#/definitions/controllers.ConversationTurn'
        type: array
      session_id:
        description: 非空则把本次检查落入该会话
        type: string
      user_instruction:
        description: 用户自定义检查意见（如"重点检查安全组"）
        maxLength: 2000
        type: string
    required:
    - files
    type: object
  controllers.CheckFile:
    properties:
      content:
        type: string
      path:
        type: string
      start_line:
        description: content 在文件中的起始行(整文件=1,选区=选区起始行)
        type: integer
    type: object
  controllers.ConversationTurn:
    properties:
      content:
        description: 该轮的文本内容
        type: string
      role:
        description: '"user" | "assistant"'
        type: string
    type: object
  controllers.GenerateConfigRequest:
    properties:
      context_ids:
        properties:
          manifest_id:
            type: string
          organization_id:
            type: string
          workspace_id:
            type: string
        type: object
      current_config:
        additionalProperties: true
        description: 现有配置，用于修复模式
        type: object
      mode:
        description: 模式：new（新建）或 refine（修复）
        type: string
      module_id:
        type: integer
      user_description:
        maxLength: 1000
        type: string
    required:
    - module_id
    - user_description
    type: object
  controllers.GenerateConfigWithCMDBSkillRequest:
    properties:
      context_ids:
        properties:
          organization_id:
            type: string
          workspace_id:
            type: string
        type: object
      current_config:
        additionalProperties: true
        type: object
      mode:
        type: string
      module_id:
        type: integer
      resource_info_map:
        additionalProperties: true
        description: 完整的资源信息（包括 ARN）
        type: object
      use_optimized:
        description: 是否使用优化版（并行执行 + AI 选择 Skills）
        type: boolean
      user_description:
        maxLength: 2000
        type: string
      user_selections:
        additionalProperties: true
        description: 支持 string 或 []string
        type: object
    required:
    - module_id
    - user_description
    type: object
  controllers.GenerateResourceRequest:
    properties:
      context:
        allOf:
        - $ref: '#/definitions/controllers.ManifestAIContext'
        description: 当前上下文来源元信息
      context_ids:
        properties:
          organization_id:
            type: string
          workspace_id:
            type: string
        type: object
      current_content:
        description: 当前选区或文件内容（修复时提供）
        type: string
      description:
        maxLength: 2000
        type: string
      history:
        description: 会话历史(上下文对话)
        items:
          $ref: '#/definitions/controllers.ConversationTurn'
        type: array
      session_id:
        description: 非空则把本次交互落入该会话(向后兼容:空则不持久化)
        type: string
    required:
    - description
    type: object
  controllers.IssueCount:
    properties:
      count:
        type: integer
      type:
        type: string
    type: object
  controllers.IssueDistribution:
    properties:
      format_violations:
        items:
          $ref: '#/definitions/controllers.IssueCount'
        type: array
      hallucination_suspects:
        type: integer
      security_tag_misses:
        type: integer
    type: object
  controllers.IssueResource:
    properties:
      details:
        description: 具体问题内容
        type: string
      resource_id:
        type: integer
      resource_name:
        type: string
      resource_summary:
        type: string
      resource_type:
        type: string
      score:
        type: integer
      verdict:
        type: string
    type: object
  controllers.ManifestAIContext:
    properties:
      end_line:
        type: integer
      file_path:
        description: manifest 内路径
        type: string
      kind:
        description: '"file" | "selection"'
        type: string
      start_line:
        type: integer
    type: object
  controllers.PreviewAssembledPromptRequest:
    properties:
      capability:
        type: string
      module_id:
        type: integer
      user_description:
        type: string
    required:
    - capability
    - module_id
    - user_description
    type: object
  controllers.ResourceTypeStats:
    properties:
      avg_score:
        type: number
      count:
        type: integer
      pass_rate:
        type: number
      resource_type:
        type: string
    type: object
  controllers.RuleMissCount:
    properties:
      miss_count:
        type: integer
      rule:
        type: string
    type: object
  controllers.SearchSummaryRequest:
    properties:
      query:
        type: string
      results:
        items:
          $ref: '#/definitions/services.SearchSummaryInputResource'
        type: array
    required:
    - query
    type: object
  controllers.SecurityTagStatsDTO:
    properties:
      hit_rate:
        type: number
      misses_by_rule:
        items:
          $ref: '#/definitions/controllers.RuleMissCount'
        type: array
      total_expected:
        type: integer
      total_hit:
        type: integer
    type: object
  controllers.SummaryAssessmentOverview:
    properties:
      assessment:
        $ref: '#/definitions/controllers.AssessmentStats'
      by_resource_type:
        items:
          $ref: '#/definitions/controllers.ResourceTypeStats'
        type: array
      daily_trend:
        items:
          $ref: '#/definitions/controllers.SummaryDailyTrend'
        type: array
      issue_distribution:
        $ref: '#/definitions/controllers.IssueDistribution'
      security_tag_stats:
        $ref: '#/definitions/controllers.SecurityTagStatsDTO'
      summary_coverage:
        $ref: '#/definitions/controllers.SummaryCoverage'
    type: object
  controllers.SummaryCoverage:
    properties:
      coverage_pct:
        type: number
      total_resources:
        type: integer
      with_summary:
        type: integer
    type: object
  controllers.SummaryDailyTrend:
    properties:
      date:
        type: string
      fail:
        type: integer
      pass:
        type: integer
      pass_rate:
        type: number
      total:
        type: integer
      warn:
        type: integer
    type: object
  controllers.UpdateModuleSkillRequest:
    properties:
      content:
        type: string
    type: object
  controllers.VectorSearchRequest:
    properties:
      limit:
        type: integer
      query:
        type: string
      resource_type:
        type: string
      source:
        type: string
      workspace_ids:
        items:
          type: string
        type: array
    required:
    - query
    type: object
  entity.Organization:
    properties:
      created_at:
        type: string
      created_by:
        description: user_id
        type: string
      description:
        type: string
      display_name:
        description: 显示名称
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        description: 唯一标识名称
        type: string
      settings:
        additionalProperties: true
        description: 组织配置
        type: object
      updated_at:
        type: string
    type: object
  entity.PermissionDefinition:
    properties:
      created_at:
        type: string
      description:
        description: 描述
        type: string
      display_name:
        description: 显示名称
        type: string
      id:
        description: '业务语义ID: orgpm-xxx, wspm-xxx'
        type: string
      is_system:
        description: 是否为系统内置
        type: boolean
      name:
        description: 权限名称（唯一）
        type: string
      resource_type:
        allOf:
        - $ref: '#/definitions/valueobject.ResourceType'
        description: 资源类型
      scope_level:
        allOf:
        - $ref: '#/definitions/valueobject.ScopeType'
        description: 适用作用域层级
    type: object
  entity.PermissionGrant:
    properties:
      expires_at:
        description: 过期时间
        type: string
      granted_at:
        description: 授权时间
        type: string
      granted_by:
        description: 授权人user_id
        type: string
      id:
        type: integer
      permission:
        allOf:
        - $ref: '#/definitions/entity.PermissionDefinition'
        description: 关联
      permission_id:
        description: 权限定义ID（业务语义ID）
        type: string
      permission_level:
        allOf:
        - $ref: '#/definitions/valueobject.PermissionLevel'
        description: 权限等级
      principal_id:
        description: 主体ID
        type: string
      principal_type:
        allOf:
        - $ref: '#/definitions/valueobject.PrincipalType'
        description: 主体类型
      reason:
        description: 授权原因
        type: string
      scope_id:
        description: 作用域ID（数字）
        type: integer
      scope_id_str:
        description: 作用域ID（语义化，如workspace_id）
        type: string
      scope_type:
        allOf:
        - $ref: '#/definitions/valueobject.ScopeType'
        description: 作用域类型
      source:
        description: 来源（direct/team/inherited）
        type: string
    type: object
  entity.Project:
    properties:
      created_at:
        type: string
      created_by:
        description: user_id
        type: string
      description:
        type: string
      display_name:
        description: 显示名称
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_default:
        description: 是否为默认项目
        type: boolean
      name:
        description: 项目名称
        type: string
      org_id:
        description: 所属组织ID
        type: integer
      organization:
        allOf:
        - $ref: '#/definitions/entity.Organization'
        description: 关联
      settings:
        additionalProperties: true
        description: 项目配置
        type: object
      updated_at:
        type: string
    type: object
  entity.Role:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      display_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_system:
        type: boolean
      name:
        type: string
      policies:
        description: 关联字段（不存储在数据库）
        items:
          $ref: '#/definitions/entity.RolePolicy'
        type: array
      updated_at:
        type: string
    type: object
  entity.RolePolicy:
    properties:
      created_at:
        type: string
      id:
        type: integer
      permission_display_name:
        type: string
      permission_id:
        description: 业务语义ID
        type: string
      permission_level:
        type: string
      permission_name:
        description: 关联字段（不存储在数据库）
        type: string
      resource_type:
        type: string
      role_id:
        type: integer
      scope_type:
        type: string
    type: object
  entity.Team:
    properties:
      created_at:
        type: string
      created_by:
        description: 创建人user_id
        type: string
      description:
        type: string
      display_name:
        description: 显示名称
        type: string
      id:
        type: string
      is_system:
        description: 是否为系统预置团队（不可删除）
        type: boolean
      members:
        items:
          $ref: '#/definitions/entity.TeamMember'
        type: array
      name:
        description: 团队名称
        type: string
      org_id:
        description: 所属组织ID
        type: integer
      organization:
        allOf:
        - $ref: '#/definitions/entity.Organization'
        description: 关联
      updated_at:
        type: string
    type: object
  entity.TeamMember:
    properties:
      id:
        type: integer
      joined_at:
        description: 加入时间
        type: string
      joined_by:
        description: 添加人user_id
        type: string
      role:
        allOf:
        - $ref: '#/definitions/entity.TeamRole'
        description: 团队内角色
      team:
        allOf:
        - $ref: '#/definitions/entity.Team'
        description: 关联
      team_id:
        type: string
      user_id:
        type: string
    type: object
  entity.TeamRole:
    enum:
    - MEMBER
    - MAINTAINER
    type: string
    x-enum-varnames:
    - TeamRoleMember
    - TeamRoleMaintainer
  gin.H:
    additionalProperties: {}
    type: object
  handlers.AddRolePolicyRequest:
    properties:
      permission_id:
        description: 业务语义ID
        type: string
      permission_level:
        type: string
      scope_type:
        type: string
    required:
    - permission_id
    - permission_level
    - scope_type
    type: object
  handlers.AddTeamMemberRequest:
    properties:
      role:
        description: MEMBER/MAINTAINER
        type: string
      user_id:
        type: string
    required:
    - role
    - user_id
    type: object
  handlers.AssignRoleRequest:
    properties:
      expires_at:
        type: string
      reason:
        type: string
      role_id:
        type: integer
      scope_id:
        type: integer
      scope_type:
        type: string
    required:
    - role_id
    - scope_id
    - scope_type
    type: object
  handlers.AuditConfig:
    properties:
      enabled:
        type: boolean
      include_body:
        type: boolean
      include_headers:
        type: boolean
    type: object
  handlers.BatchGrantPermissionItem:
    properties:
      permission_id:
        description: 业务语义ID
        type: string
      permission_level:
        type: string
    required:
    - permission_id
    - permission_level
    type: object
  handlers.BatchGrantPermissionRequest:
    properties:
      expires_at:
        type: string
      permissions:
        items:
          $ref: '#/definitions/handlers.BatchGrantPermissionItem'
        minItems: 1
        type: array
      principal_id:
        type: string
      principal_type:
        type: string
      reason:
        type: string
      scope_id:
        description: 支持 uint 和 string
      scope_type:
        type: string
    required:
    - permissions
    - principal_id
    - principal_type
    - scope_id
    - scope_type
    type: object
  handlers.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  handlers.CheckPermissionRequest:
    properties:
      required_level:
        type: string
      resource_type:
        type: string
      scope_id:
        description: 支持语义化ID和数字ID
        type: string
      scope_type:
        type: string
    required:
    - required_level
    - resource_type
    - scope_id
    - scope_type
    type: object
  handlers.CloneRoleRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      name:
        type: string
    required:
    - display_name
    - name
    type: object
  handlers.CreateOrganizationRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      name:
        type: string
      settings:
        additionalProperties: true
        type: object
    required:
    - name
    type: object
  handlers.CreateProjectRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      name:
        type: string
      org_id:
        type: integer
      settings:
        additionalProperties: true
        type: object
    required:
    - name
    - org_id
    type: object
  handlers.CreateRoleRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      name:
        type: string
    required:
    - display_name
    - name
    type: object
  handlers.CreateTeamRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      name:
        type: string
      org_id:
        type: integer
    required:
    - name
    - org_id
    type: object
  handlers.CreateTeamTokenRequest:
    properties:
      expires_in_days:
        description: 0表示永不过期
        type: integer
      token_name:
        type: string
    required:
    - token_name
    type: object
  handlers.CreateUserTokenRequest:
    properties:
      expires_in_days:
        description: 0表示永不过期
        type: integer
      token_name:
        type: string
    required:
    - token_name
    type: object
  handlers.DisableMFARequest:
    properties:
      code:
        type: string
      password:
        type: string
    required:
    - code
    - password
    type: object
  handlers.GrantPermissionRequest:
    properties:
      expires_at:
        type: string
      permission_id:
        description: 业务语义ID
        type: string
      permission_level:
        type: string
      principal_id:
        type: string
      principal_type:
        type: string
      reason:
        type: string
      scope_id:
        type: integer
      scope_type:
        type: string
    required:
    - permission_id
    - permission_level
    - principal_id
    - principal_type
    - scope_id
    - scope_type
    type: object
  handlers.GrantPresetRequest:
    properties:
      preset_name:
        description: READ/WRITE/ADMIN
        type: string
      principal_id:
        type: string
      principal_type:
        type: string
      reason:
        type: string
      scope_id:
        type: integer
      scope_type:
        type: string
    required:
    - preset_name
    - principal_id
    - principal_type
    - scope_id
    - scope_type
    type: object
  handlers.ListRolesResponse:
    properties:
      roles:
        items:
          $ref: '#/definitions/handlers.RoleWithPolicyCount'
        type: array
      total:
        type: integer
    type: object
  handlers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handlers.MFAVerifyRequest:
    properties:
      code:
        type: string
      mfa_token:
        type: string
    required:
    - code
    - mfa_token
    type: object
  handlers.PlatformConfigResponse:
    properties:
      api_port:
        type: string
      base_url:
        type: string
      cc_port:
        type: string
      host:
        type: string
      protocol:
        type: string
    type: object
  handlers.ResetPasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        minLength: 6
        type: string
    required:
    - current_password
    - new_password
    type: object
  handlers.RoleDetailResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      display_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_system:
        type: boolean
      name:
        type: string
      policies:
        items:
          $ref: '#/definitions/entity.RolePolicy'
        type: array
      updated_at:
        type: string
    type: object
  handlers.RoleWithPolicyCount:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      display_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_system:
        type: boolean
      name:
        type: string
      policies:
        description: 关联字段（不存储在数据库）
        items:
          $ref: '#/definitions/entity.RolePolicy'
        type: array
      policy_count:
        type: integer
      updated_at:
        type: string
    type: object
  handlers.SetWorkspaceProjectRequest:
    properties:
      project_id:
        type: integer
    required:
    - project_id
    type: object
  handlers.SetupInitRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  handlers.SetupMFAWithTokenRequest:
    properties:
      mfa_token:
        type: string
    required:
    - mfa_token
    type: object
  handlers.SetupStatusResponse:
    properties:
      has_admin:
        type: boolean
      initialized:
        type: boolean
      message:
        type: string
    type: object
  handlers.TestRunTaskRequest:
    properties:
      endpoint_url:
        type: string
      hmac_key:
        type: string
    required:
    - endpoint_url
    type: object
  handlers.UpdateMFAConfigRequest:
    properties:
      enabled:
        type: boolean
      enforcement:
        type: string
      grace_period_days:
        type: integer
      issuer:
        type: string
      lockout_duration_minutes:
        type: integer
      max_failed_attempts:
        type: integer
      required_backup_codes:
        type: integer
    type: object
  handlers.UpdateOrganizationRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      is_active:
        type: boolean
      settings:
        additionalProperties: true
        type: object
    type: object
  handlers.UpdatePlatformConfigRequest:
    properties:
      api_port:
        type: string
      base_url:
        type: string
      cc_port:
        type: string
      host:
        type: string
      protocol:
        type: string
    type: object
  handlers.UpdateProjectRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      is_active:
        type: boolean
      settings:
        additionalProperties: true
        type: object
    type: object
  handlers.UpdateRoleRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      is_active:
        type: boolean
    type: object
  handlers.VerifyMFARequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  handlers.VerifyMFAWithTokenRequest:
    properties:
      code:
        type: string
      mfa_token:
        type: string
    required:
    - code
    - mfa_token
    type: object
  models.AIConfig:
    properties:
      api_key:
        description: OpenAI Compatible API 密钥（查询时不返回）
        type: string
      aws_region:
        description: Bedrock 使用
        type: string
      base_url:
        description: OpenAI Compatible API 基础 URL
        type: string
      cache_enabled:
        description: Prompt Caching 配置（仅 Bedrock）
        type: boolean
      capabilities:
        description: 支持的能力场景，["*"]表示默认配置，[]表示未配置
