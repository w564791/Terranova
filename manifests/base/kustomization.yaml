apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - ha-rbac.yaml
  - service-backend.yaml
  - service-frontend.yaml
  - deployment-backend.yaml
  - deployment-frontend.yaml
  - pdb.yaml
  - networkpolicy.yaml
# Secrets are generated from gitignored env files that never enter the repo
# (this repository is public). Create them from the committed *.env.example
# templates before running kustomize; kustomize fails if they are missing.
# See manifests/README.md "Quick Deploy".
secretGenerator:
  # DB credentials (consumed by the backend and the postgres statefulset).
  - name: iac-platform
    namespace: terraform
    envs:
      - db.env
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: iac-platform
  # DATA_ENCRYPTION_KEY, SIGNING_ROOT_KEY, legacy JWT_SECRET and the legacy
  # token cutoff (docs/security/signing-and-encryption-keys.md).
  - name: iac-jwt
    namespace: terraform
    envs:
      - keys.env
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: iac-platform
